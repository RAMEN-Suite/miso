name: miso-dev

services:
  frontend:
    build:
      context: .
      target: dev
      dockerfile: client/Dockerfile
    image: miso-client
    restart: unless-stopped
    environment:
      VITE_PROTOCOL: ${PROTOCOL:-http}
      VITE_APP_HOST: ${APP_HOST:-localhost}
    depends_on:
      - backend
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: ./client/package.json
          target: /app/package.json

  backend:
    build:
      context: .
      target: dev
      dockerfile: server/Dockerfile
    image: miso-server
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROTOCOL: ${PROTOCOL:-http}
      APP_HOST: ${APP_HOST:-localhost}
      APP_PORT: ${APP_PORT:-8080}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PW: ${NEO4J_PW:-neo4jadmin}
      DATABASE_NAME: ${DATABASE_NAME:-neo4j}
      FAVICON_URL: ${FAVICON_URL:-}
      STYLESHEET_URL: ${STYLESHEET_URL:-styles.css}
      GUIDELINES_URL: ${GUIDELINES_URL:-guidelines.development.json}
      TORI_URL: ${TORI_URL:-}
      SHOYU_URL: ${SHOYU_URL:-}
    develop:
      watch:
        - action: sync
          path: ./server
          target: /app
          ignore:
            - node_modules
            - dist
        - action: rebuild
          path: ./server/package.json
          target: /app/package.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${APP_PORT:-8080}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  neo4j:
    image: neo4j:5.26.32@sha256:42ef3ebfd671ebd01fdebb6dcbe80cf7b45eef2aa3d346ef4132f7ef31e67d2f
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/var/lib/neo4j/plugins
      - ./neo4j/backups:/var/lib/neo4j/backups
      - ./neo4j/data:/data
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PW:-neo4jadmin}
      NEO4J_PLUGINS: '["apoc"]'
      apoc.import.file.enabled: "true"
      apoc.export.file.enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: apoc.\\\*,atag.\\\*
      apoc.initializer.neo4j.0: CREATE CONSTRAINT collection_uuid IF NOT EXISTS FOR (c:Collection) REQUIRE c.uuid IS UNIQUE
      apoc.initializer.neo4j.1: CREATE CONSTRAINT content_uuid IF NOT EXISTS FOR (content:Content) REQUIRE content.uuid IS UNIQUE
      apoc.initializer.neo4j.2: CREATE CONSTRAINT character_uuid IF NOT EXISTS FOR (ch:Character) REQUIRE ch.uuid IS UNIQUE
      apoc.initializer.neo4j.3: CREATE CONSTRAINT annotation_uuid IF NOT EXISTS FOR (a:Annotation) REQUIRE a.uuid IS UNIQUE
      apoc.initializer.neo4j.4: CREATE CONSTRAINT entity_uuid IF NOT EXISTS FOR (e:Entity) REQUIRE e.uuid IS UNIQUE
      apoc.initializer.neo4j.5: CREATE FULLTEXT INDEX entity_label_fulltext IF NOT EXISTS FOR (n:Entity) ON EACH [n.label]
    healthcheck:
      test: /var/lib/neo4j/bin/cypher-shell -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PW:-neo4jadmin}" "show databases;"
      start_period: 2m
